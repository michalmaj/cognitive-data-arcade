name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: uv run pytest --tb=short -q

      - name: Educational claim audit (warning only)
        run: uv run python scripts/audit_claims.py
        # Exits 0 even when findings are present — output is informational.
        # To treat findings as failures locally, run: uv run python scripts/audit_claims.py --strict
