name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            artifact: CognitiveDataArcade-windows.exe
            nuitka_output: CognitiveDataArcade.exe
          - os: macos-latest
            artifact: CognitiveDataArcade-macos
            nuitka_output: CognitiveDataArcade.bin
          - os: ubuntu-latest
            artifact: CognitiveDataArcade-linux
            nuitka_output: CognitiveDataArcade.bin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install Nuitka
        run: uv pip install nuitka

      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y patchelf ccache

      - name: Build standalone executable
        run: |
          uv run python -m nuitka \
            --onefile \
            --include-package=cognitive_data_arcade \
            --include-data-dir=assets=assets \
            --output-dir=dist \
            --output-filename=CognitiveDataArcade \
            src/cognitive_data_arcade/__main__.py
        shell: bash

      - name: Rename artifact
        run: mv dist/${{ matrix.nuitka_output }} dist/${{ matrix.artifact }}
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CognitiveDataArcade-windows.exe/CognitiveDataArcade-windows.exe
            dist/CognitiveDataArcade-macos/CognitiveDataArcade-macos
            dist/CognitiveDataArcade-linux/CognitiveDataArcade-linux
          generate_release_notes: true
