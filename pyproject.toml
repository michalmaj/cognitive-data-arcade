[project]
name = "cognitive-data-arcade"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Michał Maj", email = "michalpmaj@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=3.0.3",
    "pygame>=2.6.1",
    "scikit-learn>=1.4",
    "scipy>=1.14.0",
]

[project.scripts]
cognitive-data-arcade = "cognitive_data_arcade:main"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
ignore = [
    "E402",  # module-level import not at top — used for lazy scene imports
    "E501",  # line too long — long strings in i18n and pygame draw calls
    "E701",  # multiple statements on one line (colon)
    "E702",  # multiple statements on one line (semicolon) — common in pygame draw code
    "E731",  # lambda assignment — minor style choice
    "E401",  # multiple imports on one line
]
