[project]
name = "cognitive-data-arcade"
version = "1.0.0a0"
description = "Interactive pygame-based learning platform — 31 data science games across 6 modules, bilingual (PL/EN)"
readme = "README.md"
authors = [
    { name = "Michał Maj", email = "michalpmaj@gmail.com" }
]
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=3.0.3",
    "pygame>=2.6.1",
    "scikit-learn>=1.4",
    "scipy>=1.14.0",
]

[project.scripts]
cognitive-data-arcade = "cognitive_data_arcade:main"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
    "E402",  # module-level import not at top — used for lazy scene imports
    "E501",  # line too long — long strings in i18n and pygame draw calls
    "E701",  # multiple statements on one line (colon)
    "E702",  # multiple statements on one line (semicolon) — common in pygame draw code
    "E731",  # lambda assignment — minor style choice
    "E401",  # multiple imports on one line
    "B905",  # zip() without strict= — pygame parallel iterables; strict=False is implicit intent
    "SIM102", # nested if → and — 11 remaining cases are elif-nested Pygame event handlers where the nested form is clearer
    "SIM108", # ternary — opinion-based, harms readability in some pygame draw call contexts
    "SIM115", # open() context manager — flags NamedTemporaryFile pattern in tests (false positive)
]
