  "Model wykonuje zadanie używając tylko opisu zadania, bez żadnych oznaczonych przykładów w prompcie",
  "Model był trenowany bez żadnych oznaczonych danych",
  "Model osiąga zerowy błąd na benchmarku",
  "Model używa zerowej pamięci podczas wnioskowania",
]
options_en = [
  "The model performs a task using only the task description, without any labelled examples in the prompt",
  "The model was trained with zero labelled data",
  "The model achieves zero errors on the benchmark",
  "The model uses zero memory during inference",
]
correct_idx = 0
explanation_pl = "Zero-shot oznacza brak przykładów specyficznych dla zadania w prompcie — tylko opis w języku naturalnym co robić. Few-shot oznacza, że dołączona jest mała liczba przykładów wejście-wyjście. 'Shots' odnoszą się do przykładów w kontekście, nie w treningu."
explanation_en = "Zero-shot means no task-specific examples are given in the prompt — only a natural language description of what to do. Few-shot means a small number of input-output examples are included. 'Shots' refers to examples in the context, not in training."

