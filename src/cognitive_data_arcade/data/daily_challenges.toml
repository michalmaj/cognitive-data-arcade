q_pl = "Usuwasz wszystkie czasy reakcji powyżej 2000 ms jako 'wartości odstające'. Jakie jest główne ryzyko?"
q_en = "You remove all reaction time values above 2000 ms as outliers. What is the key risk?"
options_pl = [
  "Pozostały rozkład nie będzie już normalny",
  "Usuwanie obserwacji odstających zawsze wprowadza błąd selekcji",
  "Wolne odpowiedzi mogą być teoretycznie znaczące i ich usunięcie odrzuca prawdziwy sygnał",
  "Testy statystyczne wymagają wartości odstających do poprawnego obliczenia wariancji",
]
options_en = [
  "The remaining distribution will no longer be normal",
  "Removing outliers always introduces selection bias",
  "Slow responses may be theoretically meaningful and removing them discards real signal",
  "Statistical tests require outliers to calculate variance correctly",
]
correct_idx = 2
explanation_pl = "Bardzo wolne RT mogą odzwierciedlać prawdziwe zdarzenia poznawcze: lapsusy uwagi, rozproszenie lub trudne próby. Usunięcie ich może wypaczyć estymaty średniego RT i ukryć ważne efekty. Próg musi być teoretycznie uzasadniony."
explanation_en = "Very slow RTs may reflect genuine cognitive events: attentional lapses, task disengagement, or difficult trials. Removing them can bias mean RT estimates and hide important effects. The cutoff must be theoretically justified."

[[questions]]
id = "dc026"
module_idx = 0
q_pl = "Kiedy przejście z CSV na format Parquet ma największe znaczenie praktyczne?"
