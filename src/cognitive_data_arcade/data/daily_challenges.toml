correct_idx = 3
explanation_pl = "Bez korekty oczekiwana liczba fałszywie pozytywnych to 20 × 0,05 = 1. Korekcja Bonferroniego dzieli α przez liczbę testów (0,05/20 = 0,0025), aby kontrolować wskaźnik błędów dla całej rodziny na poziomie 0,05."
explanation_en = "Without correction, the expected number of false positives is 20 x 0.05 = 1. The Bonferroni correction divides alpha by the number of tests (0.05/20 = 0.0025) to control family-wise error rate at 0.05."

