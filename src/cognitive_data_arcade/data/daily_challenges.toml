q_pl = "Dlaczego duże modele językowe czasem produkują pewne siebie, lecz faktycznie błędne odpowiedzi?"
q_en = "Why do large language models sometimes produce confident but factually wrong answers?"
options_pl = [
  "Modele są zaprogramowane żeby być uprzejme i unikać mówienia 'nie wiem'",
  "Modele nie były wystawione na wystarczającą ilość danych treningowych",
  "Są trenowane do przewidywania prawdopodobnych kolejnych tokenów, nie do weryfikowania faktycznej prawdy — płynność i dokładność to różne cele",
  "Halucynacje pojawiają się tylko gdy model jest pytany o przyszłe zdarzenia",
]
options_en = [
  "LLMs are programmed to be polite and avoid saying 'I don't know'",
  "The models have not seen enough training data",
  "They are trained to predict likely next tokens, not to verify factual truth — fluency and accuracy are different objectives",
  "Hallucination only occurs when the model is asked about future events",
]
correct_idx = 2
explanation_pl = "Duże modele językowe są trenowane do maksymalizowania prawdopodobieństwa kolejnego tokenu, co produkuje płynny tekst. Ten cel nie nagradza jawnie faktycznej dokładności. Model interpoluje wzorce z danych treningowych i może generować brzmiące wiarygodnie, lecz fałszywe informacje — szczególnie o niszowych tematach."
explanation_en = "LLMs are trained to maximise next-token probability, producing fluent text. This objective does not explicitly reward factual accuracy. The model interpolates patterns from training data and can generate plausible-sounding but false information — especially on obscure topics."

# ── Act 6 continued: Networks and Ethics ──────────────────────────────────────

[[questions]]
id = "dc056"
module_idx = 5
q_pl = "W sieci społecznościowej wysoki współczynnik gronowania (clustering coefficient) oznacza co?"
q_en = "In a social network, a high clustering coefficient indicates what?"
options_pl = [
  "Sieć ma wiele izolowanych węzłów bez połączeń",
  "Znajomi moich znajomych są ze sobą znajomymi — trójkąty są powszechne",
  "Sieć ma małą liczbę bardzo wysoko połączonych hubów",
  "Średnia długość ścieżki między węzłami jest krótka",
]
options_en = [
  "The network has many isolated nodes with no connections",
  "Friends of friends tend to be friends — triangles are common",
  "The network has a small number of highly connected hubs",
  "The average path length between nodes is short",
]
correct_idx = 1
explanation_pl = "Współczynnik gronowania mierzy ułamek par sąsiadów węzła, które są ze sobą połączone. Wysoki średni współczynnik oznacza gęste lokalne połączenia — kliki i trójkąty, typowe dla sieci społecznościowych."
explanation_en = "The clustering coefficient measures the fraction of a node's neighbour pairs that are also connected to each other. A high average clustering coefficient means dense local interconnection — cliques and triangles, typical in social networks."

[[questions]]
id = "dc057"
module_idx = 5
q_pl = "W epidemicznym modelu SIR, co oznacza R0 > 1?"
q_en = "In the SIR epidemic model, what does R0 > 1 imply?"
options_pl = [
  "Choroba jest śmiertelna dla co najmniej 1% zakażonych",
  "Wskaźnik zakażeń przekracza wskaźnik zdrowienia we wszystkich populacjach",
  "Każda zakażona osoba zakaża dokładnie 1 inną osobę",
  "Przeciętnie jedna zakażona osoba zakaża więcej niż jedną inną — epidemia będzie się rozprzestrzeniać",
]
options_en = [
  "The disease is fatal to at least 1% of infected individuals",
  "The infection rate exceeds the recovery rate in all populations",
  "Each infected person will infect exactly 1 other person",
  "On average, one infected person infects more than one other — the epidemic will spread",
]
correct_idx = 3
explanation_pl = "R0 (podstawowa liczba reprodukcji) to oczekiwana liczba wtórnych zakażeń od jednej zakaźnej osoby w w pełni podatnej populacji. R0 > 1 → wykładniczy wzrost epidemii; R0 < 1 → wygasanie. R0 nie uwzględnia wcześniejszej odporności ani interwencji (to Re, efektywna liczba reprodukcji)."
explanation_en = "R0 (basic reproduction number) is the expected number of secondary infections from one infectious individual in a fully susceptible population. R0 > 1 means exponential epidemic growth; R0 < 1 means die-out. R0 does not account for prior immunity or interventions (that is Re)."

