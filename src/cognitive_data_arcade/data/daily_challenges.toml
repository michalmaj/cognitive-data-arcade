  "Płeć nie jest chronionym atrybutem w prawie pracy",
  "Model nie może być trenowany bez wszystkich zmiennych demograficznych",
  "Inne cechy (kod pocztowy, nazwa uczelni, hobby) mogą działać jako proxy dla płci i odtwarzać tę samą dysproporcję",
]
options_en = [
  "Removing a variable makes the model unable to perform well",
  "Gender is not a protected attribute under employment law",
  "The model cannot be trained without all demographic variables",
  "Other features (postcode, university name, hobbies) can act as proxies for gender and recreate the same disparity",
]
correct_idx = 3
explanation_pl = "Usunięcie chronionego atrybutu często nie eliminuje dyskryminacji. Inne cechy mogą być z nim wysoce skorelowane — kod pocztowy z rasą, hobby z płcią. Model uczy się tych korelacji pośrednich. Nazywa się to dyskryminacją przez proxy (proxy discrimination)."
explanation_en = "Removing a protected attribute often does not eliminate discrimination. Other features can be highly correlated with it — postcode with race, hobbies with gender. The model learns these indirect correlations. This is called proxy discrimination."

[[questions]]
id = "dc062"
module_idx = 5
q_pl = "Call center mierzy wydajność agentów przez czas rozmowy. Agenci zaczynają rozłączać się szybko, żeby minimalizować ten czas. To ilustruje:"
q_en = "A call centre measures agent performance by call duration. Agents start hanging up quickly to minimise call time. This illustrates:"
options_pl = [
  "Prawo Goodharta — gdy miara staje się celem, przestaje być dobrą miarą",
  "Paradoks Simpsona — ogólny trend odwraca się w podgrupach",
  "Błąd przeżywalności — mierzone są tylko udane rozmowy",
  "Overfitting — agenci zapamiętali metrykę",
]
options_en = [
  "Goodhart's law — when a measure becomes a target, it ceases to be a good measure",
  "Simpson's paradox — the overall trend reverses within subgroups",
  "Survivorship bias — only successful calls are measured",
  "Overfitting — the agents have memorised the metric",
]
correct_idx = 0
explanation_pl = "Prawo Goodharta: gdy metryka proxy jest używana do oceny wydajności, ludzie optymalizują samą metrykę zamiast ukrytego celu. Krótkie rozmowy mogą wyglądać dobrze, podczas gdy problemy klientów pozostają nierozwiązane. Optymalizacja metryki niszczy jej korelację z prawdziwą wydajnością."
explanation_en = "Goodhart's law: once a proxy metric is used to evaluate performance, people optimise the metric itself rather than the underlying goal. Short calls score well while customer problems go unsolved. Optimising the metric destroys its correlation with true performance."
