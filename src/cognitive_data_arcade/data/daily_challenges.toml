q_en = "Which approach applies a schema only when data is read, not when it is stored?"
options_pl = [
  "Schema-on-read",
  "Schema-on-write",
  "Schema-on-query",
  "Lazy schema",
]
options_en = [
  "Schema-on-read",
  "Schema-on-write",
  "Schema-on-query",
  "Lazy schema",
]
correct_idx = 0
explanation_pl = "Schema-on-read (stosowane w data lake, Hadoop, Parquet) przechowuje surowe bajty i wymusza strukturę dopiero przy zapytaniu. Schema-on-write (relacyjne bazy) waliduje dane w momencie zapisu — szybsze zapytania, mniejsza elastyczność."
explanation_en = "Schema-on-read (data lakes, Hadoop, Parquet) stores raw bytes and enforces structure at query time. Schema-on-write (relational databases) validates data on ingestion — faster queries, less flexibility."

[[questions]]
