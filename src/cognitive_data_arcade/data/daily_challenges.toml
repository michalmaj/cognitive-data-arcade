# ── Act 1 continued: Data Basics ──────────────────────────────────────────────

[[questions]]
id = "dc021"
module_idx = 0
q_pl = "Aplikacja webowa loguje każde kliknięcie użytkownika jako zdarzenie. W porównaniu do wiersza w ankiecie, ile zdarzeń może wygenerować jeden aktywny użytkownik dziennie?"
q_en = "A web app logs every user click as an event. Compared to a row per user in a survey, how many events might one active user generate per day?"
options_pl = [
  "Tyle samo — jedno zdarzenie to jedna odpowiedź ankietowa",
  "Dziesięć razy więcej — kliknięcia zdarzają się raz na minutę",
  "Tysiące razy więcej — zachowanie jest ciągłe",
  "Mniej — zdarzenia są automatycznie kompresowane",
]
options_en = [
  "About the same — one event equals one survey answer",
  "Ten times more — clicks happen once per minute",
  "Thousands of times more — behaviour is continuous",
  "Fewer — events are compressed automatically",
]
correct_idx = 2
explanation_pl = "Aktywny użytkownik może wygenerować tysiące zdarzeń (kliknięcia, przewijanie, najechanie kursorem) dziennie, podczas gdy ankieta zbiera tylko jeden ustrukturyzowany wiersz. Logi skalują się z częstotliwością zachowania, nie z liczbą użytkowników."
explanation_en = "An active user can generate thousands of click, scroll, and hover events per day, while a survey captures only one structured row. Event logs scale with behaviour frequency, not headcount."

