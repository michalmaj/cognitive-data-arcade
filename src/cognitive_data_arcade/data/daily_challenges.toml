  "Yes, if the removed nodes are hubs",
  "No — epidemics cannot be stopped by node removal",
]
correct_idx = 1
explanation_pl = "Sieć bezskalowa ma mało hubów i dużo peryferyjnych węzłów — losowe 5% usunięcie trafi głównie peryferia. Targetowane usunięcie top-5% hubów natomiast może rozbić sieć na izolowane składowe."
explanation_en = "A scale-free network has few hubs and many peripheral nodes — random 5% removal hits mostly periphery. Targeted removal of the top-5% hubs can break the network into isolated components."

