# src/cognitive_data_arcade/data/daily_challenges.toml
# Daily Challenge question bank.
# To add a question: copy a [[questions]] block, fill in all fields, restart app.
# module_idx: 0=Data Basics  1=Cognitive  2=Statistics  3=ML  4=NLP  5=Networks

# ── Act 1: Data Basics ────────────────────────────────────────────────────────

[[questions]]
id = "dc001"
module_idx = 0
q_pl = "10 000 wierszy w tabeli to już Big Data — prawda?"
q_en = "10,000 rows in a table already counts as Big Data — true?"
options_pl = [
  "Tak — to dużo rekordów",
  "Nie — Big Data to kwestia niemożności przetworzenia zwykłymi narzędziami",
  "Zależy od liczby kolumn",
  "Tak — każda baza powyżej 1 GB to Big Data",
]
options_en = [
  "True — that's a lot of records",
  "False — Big Data means you can't process it with standard tools",
  "Depends on the number of columns",
  "True — any database over 1 GB is Big Data",
]
correct_idx = 1
explanation_pl = "Big Data to nie kwestia liczby wierszy, lecz niemożności przetworzenia zwykłymi narzędziami (RAM, czas, architektura). 10 000 wierszy to zwykła tabela — Excel sobie poradzi."
explanation_en = "Big Data is not about row count but about inability to process with standard tools (RAM, time, architecture). 10,000 rows is a normal table — Excel can handle it."

[[questions]]
id = "dc002"
module_idx = 0
q_pl = "Brak wartości NULL oznacza, że dane są czyste — prawda?"
q_en = "No NULL values means the data is clean — true?"
options_pl = [
  "Tak — NULL to główny problem jakości danych",
  "Nie — dane mogą zawierać wartości niemożliwe, duplikaty lub błędy kodowania",
  "Tak, jeśli dodatkowo nie ma duplikatów",
  "Zależy od źródła danych",
]
options_en = [
  "True — NULLs are the main data quality problem",
  "False — data can contain impossible values, duplicates or encoding errors",
  "True, if there are also no duplicates",
  "Depends on the data source",
]
correct_idx = 1
explanation_pl = "Dane mogą być kompletne (zero NULL) a mimo to zawierać RT=-400 ms, zduplikowane wiersze z restartu sesji, czy błędne kody klawiszy. Brak NULL to warunek konieczny, nie wystarczający."
explanation_en = "Data can be complete (zero NULLs) yet contain RT=-400 ms, duplicate rows from session restarts, or wrong key codes. No NULLs is necessary but not sufficient."

[[questions]]
id = "dc003"
module_idx = 0
q_pl = "Dane nieustrukturyzowane (tekst, obraz) są zawsze trudniejsze do analizy niż tabelaryczne?"
q_en = "Unstructured data (text, images) is always harder to analyse than tabular data?"
options_pl = [
  "Tak — tabelaryczne mają jasny schemat",
  "Nie — słabo wypełniona tabela może być trudniejsza niż bogaty tekst",
  "Tak — algorytmy ML działają tylko na liczbach",
  "Zależy od liczby kolumn",
]
options_en = [
  "True — tabular data has a clear schema",
  "False — a sparsely filled table can be harder than rich text",
  "True — ML algorithms only work on numbers",
  "Depends on the number of columns",
]
correct_idx = 1
explanation_pl = "Tabela z 90% brakującymi wartościami i niejasnym schematem może być trudniejsza niż tekst o bogatej semantyce. Trudność analizy nie wynika z formatu, lecz z jakości i kontekstu danych."
explanation_en = "A table with 90% missing values and an unclear schema can be harder than semantically rich text. Analysis difficulty comes from quality and context, not format."

[[questions]]
id = "dc004"
module_idx = 0
q_pl = "Dwa identyczne wiersze w tabeli eksperymentalnej zawsze oznaczają błąd?"
q_en = "Two identical rows in an experimental table always indicate an error?"
options_pl = [
  "Tak — dane eksperymentalne muszą być unikalne",
  "Nie — mogą to być dwa różne zdarzenia z tymi samymi wartościami",
  "Tak — każdy duplikat należy usunąć",
  "Nie — duplikaty są niegroźne",
]
options_en = [
  "True — experimental data must be unique",
  "False — they could be two different events with identical values",
  "True — every duplicate should be removed",
  "False — duplicates are harmless",
]
correct_idx = 1
explanation_pl = "Dwa uczestnicy mogą mieć identyczny RT=250 ms na tej samej próbie. Duplikat to problem kontekstowy — sprawdzamy czy ten sam participant_id + trial_id pojawia się dwa razy, nie czy wartości są identyczne."
explanation_en = "Two participants can have identical RT=250 ms on the same trial. A duplicate is a context problem — we check if the same participant_id + trial_id appears twice, not whether values match."

# ── Act 2: Cognitive Experiments ──────────────────────────────────────────────

[[questions]]
id = "dc005"
module_idx = 1
q_pl = "Czas reakcji 150 ms — czy to fizjologicznie możliwy wynik?"
q_en = "A reaction time of 150 ms — is that physiologically possible?"
options_pl = [
  "Tak — wytrenowani sportowcy osiągają takie wyniki",
  "Nie — fizjologiczne minimum to ~180 ms; 150 ms to antycypacja",
  "Tak — przy bodźcu dźwiękowym jest to normalne",
  "Zależy od rodzaju bodźca",
]
options_en = [
  "Yes — trained athletes achieve such results",
  "No — the physiological minimum is ~180 ms; 150 ms means anticipation",
  "Yes — it is normal for auditory stimuli",
  "Depends on the type of stimulus",
]
correct_idx = 1
explanation_pl = "Czas przewodzenia nerwowego + przetwarzanie korowe to minimum ok. 180 ms. Wynik 150 ms oznacza antycypację (uczestnik nacisnął przed bodźcem), nie szybką reakcję. Taki trial należy wykluczyć z analizy."
explanation_en = "Neural conduction + cortical processing takes at least ~180 ms. A result of 150 ms means anticipation (participant pressed before the stimulus), not a fast response. Such trials should be excluded."

[[questions]]
id = "dc006"
module_idx = 1
q_pl = "Wyższy wynik w N-Back zawsze oznacza lepszą pamięć roboczą?"
q_en = "A higher score in N-Back always means better working memory?"
options_pl = [
  "Tak — to jedyny czynnik wpływający na wynik",
  "Nie — strategia zgadywania może zawyżyć wynik bez angażowania pamięci roboczej",
  "Tak, jeśli uczestnik nie oszukiwał",
  "Nie — wynik zależy wyłącznie od prędkości reakcji",
]
options_en = [
  "Yes — it is the only factor affecting the score",
  "No — a guessing strategy can inflate the score without engaging working memory",
  "Yes, if the participant didn't cheat",
  "No — the score depends only on reaction speed",
]
correct_idx = 1
explanation_pl = "Przy niskim N-Back można zgadywać 'tak' na każdy bodziec i uzyskać wysoką accuracy bez użycia pamięci roboczej. Dlatego ważne jest też mierzenie FA (false alarms) — wysoka accuracy przy wielu FA sugeruje strategię, nie zdolność."
explanation_en = "At low N-Back you can guess 'yes' for every stimulus and get high accuracy without using working memory. That's why measuring FA (false alarms) matters — high accuracy with many FAs suggests a strategy, not ability."

[[questions]]
id = "dc007"
module_idx = 1
q_pl = "Efekt Stroopa: wolniejsza odpowiedź przy niezgodnym bodźcu to błąd wykonania?"
q_en = "Stroop effect: a slower response to incongruent stimuli is a performance error?"
options_pl = [
  "Tak — uczestnik powinien ignorować słowo",
  "Nie — to normalny efekt interferencji kognitywnej",
  "Tak, jeśli spowolnienie przekracza 100 ms",
  "Nie — to wynik ćwiczenia",
]
options_en = [
  "Yes — the participant should ignore the word",
  "No — it is a normal cognitive interference effect",
  "Yes, if slowdown exceeds 100 ms",
  "No — it is the result of practice",
]
correct_idx = 1
explanation_pl = "Spowolnienie przy niezgodnym bodźcu to mierzony efekt kognitywny, nie błąd. Mózg automatycznie przetwarza znaczenie słowa nawet gdy zadanie tego nie wymaga — i to właśnie mierzymy efektem Stroopa."
explanation_en = "Slowdown on incongruent stimuli is a measured cognitive effect, not an error. The brain automatically processes word meaning even when the task doesn't require it — that's what the Stroop effect measures."

[[questions]]
id = "dc008"
module_idx = 1
q_pl = "W zadaniu Go/No-Go: wstrzymanie się przy bodźcu No-Go to brak odpowiedzi, nie aktywny proces?"
q_en = "In Go/No-Go: withholding a response to No-Go stimuli is a passive non-response, not an active process?"
options_pl = [
  "Tak — uczestnik po prostu nic nie robi",
  "Nie — hamowanie to aktywny proces wymagający zasobów kognitywnych",
  "Tak — bierność nie wymaga przetwarzania",
  "Zależy od trudności zadania",
]
options_en = [
  "True — the participant simply does nothing",
  "False — inhibition is an active process requiring cognitive resources",
  "True — passivity requires no processing",
  "Depends on task difficulty",
]
correct_idx = 1
explanation_pl = "Hamowanie reakcji to aktywny proces wymagający wykrycia bodźca, rozpoznania go jako No-Go i zablokowania przygotowanej odpowiedzi motorycznej. Wymagane zasoby są mierzalne przez FA rate i wzrost RT pod koniec sesji."
explanation_en = "Response inhibition is an active process requiring stimulus detection, classifying it as No-Go, and blocking the prepared motor response. The required resources are measurable via FA rate and RT increase at session end."

# ── Act 3: Statistics ─────────────────────────────────────────────────────────

[[questions]]
id = "dc009"
module_idx = 2
q_pl = "Masz p=0,03 przy N=8. Czy to solidny dowód hipotezy?"
q_en = "You get p=0.03 with N=8. Is that solid evidence for your hypothesis?"
options_pl = [
  "Tak — p<0,05 to próg istotności statystycznej",
  "Nie — przy N=8 moc testu jest zbyt niska",
  "Tak, jeśli efekt jest duży",
  "Zależy od testu jednostronnego lub dwustronnego",
]
options_en = [
  "Yes — p<0.05 is the threshold for statistical significance",
  "No — with N=8 statistical power is too low",
  "Yes, if the effect is large",
  "Depends on one-tailed vs two-tailed test",
]
correct_idx = 1
explanation_pl = "Przy N=8 typowa moc testu wynosi poniżej 30%. Efekt losowy łatwo daje p<0,05 przy tak małej próbie. Przed wnioskowaniem sprawdź moc: przy d=0,5 i alfa=0,05 potrzeba N≈64 do mocy 80%."
explanation_en = "With N=8 typical test power is below 30%. A chance effect easily yields p<0.05 with such a small sample. Before concluding, check power: for d=0.5, alpha=0.05, you need N≈64 for 80% power."

[[questions]]
id = "dc010"
module_idx = 2
q_pl = "Korelacja r=0,9 między A i B oznacza, że A powoduje B?"
q_en = "A correlation of r=0.9 between A and B means A causes B?"
options_pl = [
  "Tak — silna korelacja to dowód przyczynowości",
  "Nie — może być zmienna ukryta, odwrotna przyczynowość lub przypadek",
  "Tak, jeśli r > 0,8",
  "Nie — korelacja nigdy nie jest dowodem",
]
options_en = [
  "True — strong correlation is evidence of causality",
  "False — there may be a confound, reverse causality or chance",
  "True, if r > 0.8",
  "False — correlation is never evidence",
]
correct_idx = 1
explanation_pl = "Spożycie lodów i liczba utonięć korelują r≈0,9 — obie zmienne rosną latem (zmienna ukryta: temperatura). Korelacja nie mówi nic o kierunku ani mechanizmie przyczynowym."
explanation_en = "Ice cream consumption and drowning deaths correlate at r≈0.9 — both increase in summer (confound: temperature). Correlation says nothing about direction or causal mechanism."

[[questions]]
id = "dc011"
module_idx = 2
q_pl = "Odrzucenie H0 przy p<0,05 oznacza, że H0 jest fałszywa?"
q_en = "Rejecting H0 at p<0.05 means H0 is false?"
options_pl = [
  "Tak — to definicja testu istotności",
  "Nie — oznacza tylko, że dane są mało prawdopodobne przy założeniu H0",
  "Tak, przy co najmniej 95% pewności",
  "Zależy od rozmiaru próby",
]
options_en = [
  "True — that is the definition of significance testing",
  "False — it only means the data are unlikely under H0",
  "True, with at least 95% confidence",
  "Depends on sample size",
]
correct_idx = 1
explanation_pl = "p-wartość to P(dane | H0), nie P(H0 | dane). Przy progu 5% i 20 niezależnych testach spodziewamy się jednego fałszywego alarmu przez sam przypadek, nawet jeśli wszystkie H0 są prawdziwe."
explanation_en = "The p-value is P(data | H0), not P(H0 | data). At a 5% threshold and 20 independent tests, we expect one false alarm by chance alone, even if all H0s are true."

