  "Nadpisywanie surowych danych narusza przepisy RODO",
  "W praktyce nie ma technicznej możliwości nadpisania surowych danych",
  "Jeśli błąd preprocesowania zostanie wykryty później, surowe dane to jedyny sposób na odtworzenie czystych wyników od podstaw",
]
options_en = [
  "Raw files are read-only by convention in most databases",
  "Overwriting raw data violates GDPR regulations",
  "It is technically impossible to overwrite raw data in practice",
  "If a preprocessing error is found later, the raw data is the only way to reproduce clean output from scratch",
]
correct_idx = 3
explanation_pl = "Odtwarzalność to główny powód. Jeśli po zgubieniu surowego pliku wykryjemy błąd w skrypcie czyszczącym, nie możemy poprawnie zregenerować czystego zbioru. Surowe dane to jedyne źródło prawdy."
explanation_en = "Reproducibility is the core reason. If a bug is found in a cleaning script after the raw file is gone, the clean dataset cannot be regenerated correctly. Raw data is the single source of truth."

