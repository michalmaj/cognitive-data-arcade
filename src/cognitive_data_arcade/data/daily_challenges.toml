explanation_en = "The number of possible n-grams grows exponentially with n. With a small training set most trigrams and 4-grams appear only once — sparse features that don't generalise. Bigrams are usually the optimal trade-off."

# ── Act 6: Networks, Ethics & Finale ─────────────────────────────────────────

[[questions]]
id = "dc018"
module_idx = 5
q_pl = "Hub sieci (węzeł o wysokim stopniu) = zawsze najważniejszy węzeł?"
q_en = "A network hub (high-degree node) = always the most important node?"
options_pl = [
  "Tak — stopień węzła wyznacza jego ważność",
  "Nie — węzeł z wysoką pośredniością może kontrolować więcej przepływu niż hub",
  "Tak, w sieciach bezskalowych",
  "Nie — ważność węzła jest niemierzalna",
]
options_en = [
  "Yes — node degree defines its importance",
  "No — a node with high betweenness can control more flow than a hub",
  "Yes, in scale-free networks",
  "No — node importance is unmeasurable",
]
correct_idx = 1
explanation_pl = "Betweenness centrality mierzy ile najkrótszych ścieżek przechodzi przez węzeł. Węzeł łączący dwie gęste społeczności może mieć niski stopień, ale usunięcie go rozspójni całą sieć."
explanation_en = "Betweenness centrality measures how many shortest paths pass through a node. A node connecting two dense communities may have low degree, but removing it disconnects the entire network."

