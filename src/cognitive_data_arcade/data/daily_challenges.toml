q_en = "Under GDPR Article 22, what right does a person have when a loan application is rejected by an automated system?"
options_pl = [
  "Prawo do automatycznego odwrócenia decyzji",
  "Prawo do sensownego wyjaśnienia logiki decyzji oraz prawo do przeglądu przez człowieka",
  "Prawo do wglądu w dane treningowe modelu",
  "Prawo do żądania użycia innego algorytmu",
]
options_en = [
  "The right to have the decision automatically reversed",
  "The right to meaningful explanation of the logic and the right to human review",
  "The right to access the model's training data",
  "The right to request a different algorithm be used",
]
correct_idx = 1
explanation_pl = "Art. 22 RODO ogranicza w pełni zautomatyzowane decyzje o znaczących skutkach. Osoby mają prawo do: (1) niebycia poddanym wyłącznie automatycznym decyzjom, (2) uzyskania znaczących informacji o zaangażowanej logice, (3) żądania przeglądu przez człowieka. 'Znaczące informacje' nie wymagają ujawnienia pełnego modelu."
explanation_en = "GDPR Art. 22 restricts fully automated decisions with significant effects. Individuals have the right to: (1) not be subject to solely automated decisions, (2) obtain meaningful information about the logic involved, (3) request human review. 'Meaningful information' does not require revealing the full model."

