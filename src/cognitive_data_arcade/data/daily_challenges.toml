explanation_en = "Demand characteristics (Orne, 1962): participants infer what response the researcher wants and comply or contrast accordingly. This threatens internal validity and is why blinding exists in experimental design."

# ── Act 3 continued: Statistics ───────────────────────────────────────────────

[[questions]]
id = "dc035"
module_idx = 2
q_pl = "Centralne Twierdzenie Graniczne (CTG) mówi, że rozkład próbkowy średniej staje się normalny niezależnie od rozkładu populacji. Kiedy to zazwyczaj obowiązuje?"
q_en = "The Central Limit Theorem states that the sampling distribution of the mean approaches normal regardless of the population distribution. When does this typically apply?"
options_pl = [
  "Gdy liczebność próby n jest wystarczająco duża (często n >= 30)",
  "Tylko gdy populacja jest już normalnie rozłożona",
  "Tylko dla zmiennych ciągłych",
  "Gdy wariancja jest mniejsza niż średnia",
]
options_en = [
  "When sample size n is sufficiently large (often n >= 30)",
  "Only when the population is already normally distributed",
  "Only for continuous variables",
  "When the variance is smaller than the mean",
]
correct_idx = 0
explanation_pl = "CTG działa dla dużego n (reguła kciuka: >= 30, lecz zależy od skośności). To dlatego wiele testów parametrycznych jest odporne nawet gdy surowe dane są nienormalne — opierają się na rozkładzie próbkowym średnich, nie indywidualnych wyników."
explanation_en = "CLT kicks in for large n (rule of thumb >= 30, but depends on skewness). This is why many parametric tests are robust even when raw data is non-normal — they rely on the sampling distribution of means, not of individual scores."

