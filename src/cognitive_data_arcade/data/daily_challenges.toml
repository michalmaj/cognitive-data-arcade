q_pl = "Firma wyrównuje dokładność (80%) modelu decyzyjnego we wszystkich grupach rasowych. Dlaczego może to nadal być niesprawiedliwe?"
q_en = "A company equalises accuracy (80%) across racial groups in a decision model. Why might this still be unfair?"
options_pl = [
  "Wyrównanie dokładności to złoty standard sprawiedliwości algorytmicznej",
  "Różne grupy rasowe z natury różnią się w przewidywanym wyniku",
  "Równa dokładność może ukrywać bardzo różne wskaźniki fałszywie pozytywnych i fałszywie negatywnych — typy błędów mogą szkodzić grupom w różny sposób",
  "Dokładność nigdy nie powinna być taka sama w różnych grupach demograficznych",
]
options_en = [
  "Equalising accuracy is the gold standard of algorithmic fairness",
  "Different racial groups are inherently different in the outcome being predicted",
  "Equal accuracy can hide very different false positive and false negative rates — error types may harm groups differently",
  "Accuracy should never be the same across demographic groups",
]
correct_idx = 2
explanation_pl = "Równa dokładność jest kompatybilna z wysoce nierównymi wskaźnikami fałszywie pozytywnych i fałszywie negatywnych. W ocenie ryzyka recydywy wysoki wskaźnik fałszywie pozytywnych dla jednej grupy oznacza więcej niesłusznie flagowanych niewinnych. Twierdzenie Chouldechovy pokazuje, że wielokrotne kryteria sprawiedliwości nie mogą być jednocześnie spełnione."
explanation_en = "Equal accuracy is compatible with highly unequal false positive and false negative rates. In criminal risk assessment, high false positives for one group means more innocent people flagged incorrectly. The Chouldechova impossibility theorem shows multiple fairness criteria cannot be simultaneously satisfied."

